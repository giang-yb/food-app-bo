<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Người dùng</h1>
  </div>

  <!-- Search -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
    <div class="flex gap-4">
      <div class="flex-1">
        <input [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
          placeholder="Tìm kiếm theo email hoặc tên..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
      </div>
      <button (click)="onSearch()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium">
        Tìm kiếm
      </button>
    </div>
  </div>

  <app-spinner *ngIf="loading()" label="overlay"></app-spinner>

  <ng-container *ngIf="!loading()">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Người dùng</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vai trò</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ngày tham gia</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let user of users()" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center gap-3">
                <app-avatar [src]="user.avatar_url || ''" [alt]="user.full_name || user.email" size="md"></app-avatar>
                <span class="font-medium text-gray-900">{{ user.full_name || '—' }}</span>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ user.email }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
              <app-badge [variant]="getRoleVariant(user.role)" [showDot]="true">{{ user.role }}</app-badge>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ formatDate(user.created_at) }}</td>
          </tr>
          <tr *ngIf="users().length === 0">
            <td colspan="4" class="px-6 py-12 text-center text-sm text-gray-500">Chưa có người dùng nào</td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>
</div>
