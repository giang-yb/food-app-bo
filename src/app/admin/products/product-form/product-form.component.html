<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex items-center gap-4">
    <button (click)="goBack()" class="p-2 rounded-lg hover:bg-gray-100">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
    </button>
    <h1 class="text-2xl font-bold text-gray-900">
      {{ isEditMode() ? 'Sửa sản phẩm' : 'Thêm sản phẩm' }}
    </h1>
  </div>

  <app-spinner *ngIf="loading()" label="overlay"></app-spinner>

  <form (ngSubmit)="save()" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm *</label>
      <input [(ngModel)]="name" name="name" required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
      <textarea [(ngModel)]="description" name="description" rows="4"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Giá (VNĐ) *</label>
        <input [(ngModel)]="price" name="price" type="number" required min="0"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Danh mục *</label>
        <select [(ngModel)]="category_id" name="category_id" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
          <option value="">Chọn danh mục</option>
          <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.name }}</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Hình ảnh</label>
      <input type="file" accept="image/*" (change)="onImageSelected($event)"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
      <div *ngIf="imagePreview || image_url" class="mt-3">
        <img [src]="imagePreview || image_url" alt="Preview" class="w-32 h-32 rounded-lg object-cover border">
      </div>
    </div>

    <div class="flex items-center gap-2">
      <input [(ngModel)]="is_available" name="is_available" type="checkbox" id="is_available"
        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500/50">
      <label for="is_available" class="text-sm font-medium text-gray-700">Còn hàng</label>
    </div>

    <div class="flex justify-end gap-3">
      <button type="button" (click)="goBack()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
        Hủy
      </button>
      <button type="submit" [disabled]="loading()"
        class="px-6 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 transition-colors">
        {{ isEditMode() ? 'Lưu thay đổi' : 'Thêm sản phẩm' }}
      </button>
    </div>
  </form>
</div>
