<aside class="h-screen bg-white border-r border-gray-200 flex flex-col transition-all duration-300"
  [class.w-64]="!collapsed"
  [class.w-20]="collapsed">

  <!-- Logo -->
  <div class="h-16 flex items-center justify-between px-4 border-b border-gray-100">
    <span *ngIf="!collapsed" class="font-bold text-lg text-blue-600">🍔 FoodAdmin</span>
    <span *ngIf="collapsed" class="font-bold text-lg text-blue-600">🍔</span>
    <button (click)="toggle()" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Nav Items -->
  <nav class="flex-1 py-4 px-3 space-y-1">
    <a *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="bg-blue-50 text-blue-600"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">{{ item.label }}</span>
    </a>
  </nav>
</aside>
