<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6">
  <div class="flex items-center gap-4">
    <h1 class="text-lg font-semibold text-gray-900">Quản lý cửa hàng</h1>
  </div>

  <div class="flex items-center gap-4">
    <!-- Notifications -->
    <button class="relative p-2 rounded-lg hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- User Menu -->
    <div class="relative">
      <button (click)="userMenuOpen = !userMenuOpen" class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
        <app-avatar [src]="''" alt="Admin" size="sm"></app-avatar>
        <span class="text-sm font-medium text-gray-700">Admin</span>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div *ngIf="userMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
        <button (click)="signOut(); userMenuOpen = false"
          class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition-colors">
          Đăng xuất
        </button>
      </div>
    </div>
  </div>
</header>
