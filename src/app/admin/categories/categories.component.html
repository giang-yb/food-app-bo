<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Danh mục</h1>
    <button (click)="openAddModal()"
      class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      Thêm danh mục
    </button>
  </div>

  <app-spinner *ngIf="loading()" label="overlay"></app-spinner>

  <ng-container *ngIf="!loading()">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let cat of categories()"
        class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="aspect-video bg-gray-100 relative">
          <img *ngIf="cat.image_url" [src]="cat.image_url" [alt]="cat.name" class="w-full h-full object-cover">
          <div *ngIf="!cat.image_url" class="w-full h-full flex items-center justify-center">
            <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-gray-900">{{ cat.name }}</h3>
          <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ cat.description || 'Không có mô tả' }}</p>
          <div class="flex gap-2 mt-4">
            <button (click)="openEditModal(cat)"
              class="flex-1 px-3 py-1.5 text-sm font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
              Sửa
            </button>
            <button (click)="confirmDelete(cat)"
              class="flex-1 px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">
              Xóa
            </button>
          </div>
        </div>
      </div>
      <tr *ngIf="categories().length === 0">
        <td colspan="4" class="px-6 py-12 text-center text-sm text-gray-500">Chưa có danh mục nào</td>
      </tr>
    </div>
  </ng-container>
</div>

<!-- Add/Edit Modal -->
<app-modal [open]="modalOpen()" [title]="editMode() ? 'Sửa danh mục' : 'Thêm danh mục'" (close)="modalOpen.set(false)">
  <form (ngSubmit)="save()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tên danh mục *</label>
      <input [(ngModel)]="formName" name="name" required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
      <textarea [(ngModel)]="formDescription" name="description" rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Hình ảnh</label>
      <input type="file" accept="image/*" (change)="onImageSelected($event)"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500">
      <div *ngIf="imagePreview || formImageUrl" class="mt-2">
        <img [src]="imagePreview || formImageUrl" alt="Preview" class="w-24 h-24 rounded-lg object-cover border">
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" (click)="modalOpen.set(false)"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">Hủy</button>
      <button type="submit"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
        {{ editMode() ? 'Lưu' : 'Thêm' }}
      </button>
    </div>
  </form>
</app-modal>

<!-- Delete Confirmation Modal -->
<app-modal [open]="deleteModalOpen()" title="Xác nhận xóa" (close)="deleteModalOpen.set(false)">
  <p class="text-gray-600">Bạn có chắc muốn xóa danh mục <strong>{{ selectedCategory()?.name }}</strong>?</p>
  <div class="flex justify-end gap-3 mt-6">
    <button (click)="deleteModalOpen.set(false)"
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">Hủy</button>
    <button (click)="deleteCategory()"
      class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">Xóa</button>
  </div>
</app-modal>
